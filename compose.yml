services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuanto"]
      interval: 5s
      retries: 5

  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    ports:
      - "2480:2480"
    environment:
      TAP_WEBHOOK_URL: "http://host.docker.internal:5173/api/tap/webhook"
      TAP_ADMIN_PASSWORD: "${TAP_ADMIN_PASSWORD}"
      TAP_NO_REPLAY: "true"
      TAP_SIGNAL_COLLECTION: bio.lexicons.temp.surveyProtocol
      TAP_COLLECTION_FILTERS: "bio.lexicons.temp.surveyProtocol,bio.lexicons.temp.surveyTarget,bio.lexicons.temp.survey,bio.cuanto.surveyProtocol.follow,bio.lexicons.temp.occurrence"
    volumes:
      - tap_data:/data
    restart: unless-stopped

volumes:
  db_data:
  tap_data:
